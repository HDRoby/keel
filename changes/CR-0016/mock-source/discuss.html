<body class="bg-k-page text-k-body text-sm antialiased">
<div id="app"></div>
<script>
'use strict';
const S = {
  dStep: 0, dStreamLen: null, dAgreed: false, dEdit: false,
  rrKind: 'keel', rrPhase: 'idle', rrStep: 0, rrRead: {}, rrAdv: {}, rrDone: false,
  route: 'startup', check: 'ollama', checking: false,
  initCase: 'new', initPath: 'baseline', openFolders: {},
  active: 'who', fields: null, reviewing: false,

const esc = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const I = (n, cls = '') => `<span class="ms ${cls}">${n}</span>`;
const set = (patch) => { Object.assign(S, patch); render(); };

/* ---------- small components ---------- */
const TONES = {
  blue: 'bg-k-blue-soft text-k-blue-dark', ok: 'bg-k-ok-soft text-k-ok-text', warn: 'bg-k-warn-soft text-k-warn-text',
  bad: 'bg-k-bad-soft text-k-bad', gray: 'bg-[#f0f2f5] text-k-sec', link: 'bg-k-link-soft text-k-link-text', purple: 'bg-[#f3ecff] text-[#6b3fb3]'
};
const tag = (t, tone = 'gray') => `<span class="inline-flex items-center gap-1 rounded-full px-2 py-px text-xs leading-4 whitespace-nowrap ${TONES[tone]}">${t}</span>`;
const btn = (label, { v = 'primary', act = '', icon = '', disabled = false, size = '' } = {}) => {
  const base = 'inline-flex items-center gap-2 rounded-lg border text-sm leading-5 transition-colors duration-100 ' + (size === 'sm' ? 'px-3 py-1' : 'px-[15px] py-[7px] min-h-9');
  const look = disabled ? 'bg-k-line border-transparent text-k-muted cursor-not-allowed'
    : v === 'primary' ? 'bg-k-blue border-k-blue text-white hover:bg-k-blue-dark hover:border-k-blue-dark'
    : v === 'secondary' ? 'bg-k-blue-soft border-k-blue-soft text-k-blue hover:bg-k-blue hover:text-white'
    : v === 'outline' ? 'bg-white border-k-blue text-k-blue hover:bg-k-blue-soft'
    : v === 'danger' ? 'bg-white border-k-bad text-k-bad hover:bg-k-bad-soft'
    : 'bg-transparent border-transparent text-k-blue hover:bg-k-blue-soft px-2';
  return `<button type="button" class="${base} ${look}" ${disabled ? 'disabled' : ''} ${act ? `data-act="${act}"` : ''}>${icon ? I(icon, 'text-[20px]') : ''}${label}</button>`;
};
const link = (label, act, tone = 'text-k-blue') => `<button type="button" data-act="${act}" class="text-xs font-medium ${tone} hover:underline">${label}</button>`;
const card = (inner, cls = '') => `<section class="bg-white rounded-card shadow-card p-6 ${cls}">${inner}</section>`;
const h2 = (t, meta = '') => `<div class="flex flex-col gap-1"><h2 class="text-lg leading-[26px] font-medium text-black">${t}</h2>${meta ? `<p class="text-xs leading-4 text-k-muted">${meta}</p>` : ''}</div>`;
const notice = (kind, title, text) => {
  const m = { info: ['info', 'border-k-blue bg-k-blue-soft', 'text-k-blue'], ok: ['check_circle', 'border-k-ok bg-k-ok-soft', 'text-k-ok'], warn: ['warning', 'border-[#e87d1e] bg-[#fdf2e9]', 'text-[#e87d1e]'], bad: ['error', 'border-k-bad bg-k-bad-soft', 'text-k-bad'] }[kind];
  return `<div class="flex gap-3 rounded-lg border-l-4 px-4 py-3 ${m[1]}">${I(m[0], 'text-[20px] ' + m[2])}<div class="flex flex-col gap-1"><span class="font-medium text-black">${title}</span><span class="text-k-sec">${text}</span></div></div>`;
};
const field = (label, value, { hint = '', multi = false, rows = 3, ph = '', opt = '' } = {}) => `
  <label class="flex flex-col gap-1.5">
    ${label ? `<span class="text-sm text-k-body">${label}${opt ? ` <span class="text-xs text-k-muted">${opt}</span>` : ''}</span>` : ''}
    ${multi ? `<textarea rows="${rows}" placeholder="${esc(ph)}" class="w-full rounded-lg border border-k-muted px-4 py-2 text-sm text-black placeholder:text-k-muted hover:border-k-blue focus:border-k-blue focus:outline-none focus:ring-2 focus:ring-k-blue-mid/60">${esc(value)}</textarea>`
      : `<input value="${esc(value)}" placeholder="${esc(ph)}" class="w-full rounded-lg border border-k-muted px-4 py-2 text-sm text-black placeholder:text-k-muted hover:border-k-blue focus:border-k-blue focus:outline-none focus:ring-2 focus:ring-k-blue-mid/60">`}
    ${hint ? `<span class="text-xs leading-4 text-k-muted">${hint}</span>` : ''}
  </label>`;
const select = (label, options, value, hint = '') => `
  <label class="flex flex-col gap-1.5">
    <span class="text-sm text-k-body">${label}</span>
    <span class="relative"><select class="w-full appearance-none rounded-lg border border-k-muted bg-white px-4 py-2 pr-9 text-sm text-black hover:border-k-blue focus:border-k-blue focus:outline-none">${options.map((o) => `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>${I('expand_more', 'pointer-events-none absolute right-3 top-2 text-k-muted')}</span>
    ${hint ? `<span class="text-xs leading-4 text-k-muted">${hint}</span>` : ''}
  </label>`;
const segmented = (items, cur, act) => `<div class="inline-flex rounded-lg bg-[#f0f2f5] p-0.5">${items.map(([v, l]) => `<button data-act="${act}:${v}" class="rounded-md px-3 py-1 text-[13px] leading-[18px] ${v === cur ? 'bg-white font-medium text-black shadow-sm' : 'text-k-muted'}">${l}</button>`).join('')}</div>`;

const mockbar = (items, cur, act) => `<div class="flex flex-wrap items-center gap-2 rounded-lg border border-dashed border-k-line-2 px-3 py-2 text-xs text-k-muted"><span>Mockup only, try:</span>${items.map(([v, l]) => `<button data-act="${act}:${v}" class="rounded-full border px-2.5 py-0.5 ${v === cur ? 'border-k-blue bg-k-blue-soft text-k-blue-dark' : 'border-k-line bg-white text-k-sec'}">${l}</button>`).join('')}</div>`;

/* ---------- shell ---------- */
const NAV = [
  ['Project · Keel', 'lightbulb', [['setup', 'Project setup'], ['explore', 'Explore'], ['intent', 'Intent'], ['spec', 'Spec'], ['plan', 'Plan'], ['handoff', 'Handoff'], ['roadmap', 'Roadmap'], ['changes', 'Changes'], ['discuss', 'Discuss a change'], ['readiness', 'AI readiness']]],
  ['Library (.keel)', 'folder', [['templates', 'Templates'], ['styles', 'Brainstorm styles'], ['standards', 'Standards']]],
  ['Settings', 'settings', [['settings', 'Settings'], ['startup', 'Startup check']]]
];
const SETUP_NAV = [['Setup', 'build', [['startup', 'Startup check'], ['settings', 'Settings']]], ['Project · Keel (locked)', 'lock', []]];
const INIT_NAV = [['This folder', 'folder', [['init', 'Initialise'], ['readiness', 'AI readiness']]]];
const TITLES = { discuss: 'Discuss a change', readiness: 'AI readiness report', startup: 'Startup check', open: 'Open Keel', init: 'Initialise', setup: 'Project setup', explore: 'Explore', intent: 'Intent', spec: 'Spec and feasibility', plan: 'Plan', handoff: 'Handoff', roadmap: 'Roadmap', changes: 'Changes', change: 'Change request', templates: 'Templates', styles: 'Brainstorm styles', standards: 'Standards', settings: 'Settings' };
function shell(content) {
  const blocked = S.route === 'startup' && S.check !== 'ok';
  const groups = S.route === 'init' ? INIT_NAV : blocked ? SETUP_NAV : NAV;
  const activeRoute = S.route === 'change' ? 'changes' : S.route;
  const nav = groups.map(([g, ic, items]) => {
    const groupActive = items.some(([id]) => id === activeRoute);
    return `<div class="flex flex-col"><div class="flex items-center gap-2 px-4 py-2 font-medium ${groupActive ? 'text-k-blue' : 'text-k-body'}">${I(ic, 'text-[20px]')}${g}</div>
      ${items.map(([id, l]) => `<a href="#${id}" class="relative mx-2 rounded-lg px-4 py-2 pl-8 ${id === activeRoute ? 'text-k-blue font-medium' : 'text-k-body hover:bg-k-page'}">${id === activeRoute ? '<span class="absolute left-1 top-1.5 bottom-1.5 w-1 rounded-full bg-k-blue"></span>' : ''}${l}</a>`).join('')}</div>`;
  }).join('');
  return `<div class="grid min-h-screen grid-cols-[250px_1fr] grid-rows-[60px_1fr]">
    <nav class="row-span-2 flex flex-col gap-6 border-r border-k-line bg-white px-2 py-6">
      <a href="#open" class="flex items-center gap-2 px-4"><span class="grid h-7 w-7 place-items-center rounded-lg bg-k-blue text-white">${I('sailing', 'text-[18px]')}</span><span class="text-lg font-bold text-black">Keel</span></a>
      ${nav}
      <div class="mt-auto px-4 text-xs text-k-muted">Tailwind rebuild of the mockup · <a href="#open" class="text-k-blue">all screens</a></div>
    </nav>
    <header class="flex flex-col justify-center gap-0.5 border-b border-k-line bg-white px-6"><span class="text-xs text-k-muted">Keel · ~/keel</span><span class="text-lg leading-[26px] text-black">${TITLES[S.route] || ''}</span></header>
    <main class="min-w-0 p-6">${content}</main>
  </div>`;
}
const pageHead = (meta, right = '', desc = '') => `<div class="flex flex-wrap items-center justify-between gap-4">
  <div class="flex min-w-0 flex-1 flex-col gap-1"><div class="flex flex-wrap items-center gap-4"><h1 class="text-2xl font-bold leading-7 text-black">Keel</h1><span class="text-xs text-k-muted">${meta}</span><a href="#setup" class="inline-flex items-center gap-1 text-k-blue">${I('edit', 'text-[16px]')}Project setup</a></div>
  ${desc ? `<p class="max-w-3xl text-k-muted">${desc}</p>` : ''}</div>${right}</div>`;
const DESC = 'From an idea to an agent-ready project: brainstorm, intent, spec and plan, handoff to any coding agent, and read-back of its changes.';
function stageBar(cur, reached = 'handoff', stale = '') {
  const ids = ['explore', 'intent', 'spec', 'plan', 'handoff'], labels = ['1 · Explore', '2 · Intent', '3 · Spec', '4 · Plan', '5 · Handoff'];
  const done = ['Brainstorm complete', 'Approved v3', 'Go · v9', 'Approved v10', 'Written · 2 changes to review'];
  const locked = ['', 'Needs the required sections', 'Needs an approved intent', 'Needs a Go decision on the spec', 'Needs an approved plan'];
  const ci = ids.indexOf(cur), ri = ids.indexOf(reached);
  return `<nav class="flex flex-wrap gap-2 rounded-card bg-white p-2 shadow-card">${ids.map((id, i) => {
    const isLocked = i > ri && i !== ci, active = i === ci, isStale = stale === id;
    const cls = active ? 'bg-k-blue-soft text-k-blue border border-k-blue' : isLocked ? 'bg-k-page text-k-muted border border-dashed border-k-line-2 cursor-not-allowed' : 'text-k-body border border-transparent hover:bg-k-page';
    const ic = active ? I('radio_button_checked', 'text-[20px] text-k-blue') : isLocked ? I('lock', 'text-[20px] text-k-muted') : isStale ? I('error', 'text-[20px] text-[#b35a00]') : I('check_circle', 'text-[20px] text-k-ok');
    const note = isLocked ? locked[i] : isStale ? 'Out of date · CR-0003' : done[i];
    return `<${isLocked ? 'div' : `a href="#${id}"`} class="flex min-h-14 min-w-0 flex-[1_1_180px] items-center gap-2 rounded-lg px-4 py-2 ${cls}">${ic}<span class="flex min-w-0 flex-col"><span class="font-medium">${labels[i]}</span><span class="text-xs ${isLocked ? '' : 'text-k-muted'}">${note}</span></span></${isLocked ? 'div' : 'a'}>`;
  }).join('')}</nav>`;
}

const SCREENS = {};

SCREENS.open = () => `<div class="mx-auto flex max-w-4xl flex-col gap-6">

  return `<div class="flex flex-col gap-6">
    ${mockbar([['0', 'Start'], ['4', 'Talking'], ['6', 'Proposal'], ['done', 'Created']], S.dAgreed ? 'done' : String(S.dStep), 'dstage')}
    <div class="flex flex-wrap items-end justify-between gap-4"><div class="flex flex-col gap-1"><div class="flex items-center gap-3"><h1 class="text-2xl font-bold text-black">Discuss a change</h1>${S.dStep ? tag('DSC-0003 · Review pack for the spec', 'blue') : ''}</div><p class="max-w-3xl text-k-muted">Talk it through with the assistant. When you agree with its proposal, Keel writes the change request package. The conversation is saved with it, so you can always see why a requirement exists.</p></div><a href="#changes" class="text-k-blue">All change requests</a></div>
    <div class="flex flex-wrap items-start gap-6">
      <div class="flex min-w-0 flex-[999_1_620px] flex-col gap-5">${card(`<div class="flex flex-col gap-5">${chat}</div>`)}${created}${composer}</div>
      <div class="flex min-w-0 flex-[1_1_320px] flex-col gap-6">
        ${card(`<div class="flex flex-col gap-3">${h2('This discussion')}${[['Model', 'qwen3:32b · Ollama · “Discussion” in Settings'], ['Style', 'Requirements partner · v1'], ['Saved', S.dAgreed ? 'changes/CR-0017/discussion.md' : '.keel/discussions/DSC-0003.md, as you go'], ['Status', S.dAgreed ? 'Became CR-0017' : S.dStep === DSC.length ? 'Proposal waiting for you' : S.dStep ? 'In progress' : 'Not started']].map(([k, v]) => `<div class="flex flex-col"><span class="text-xs text-k-muted">${k}</span><span class="text-[13px] ${k === 'Saved' ? 'font-mono text-xs' : ''} text-black">${v}</span></div>`).join('')}<a href="#styles" class="text-[13px] text-k-blue">How the assistant discusses (edit the style)</a></div>`)}
        ${card(`<div class="flex flex-col gap-3">${h2('What the assistant can see', 'Keel’s documents and file names. Nothing else unless you attach it.')}
          ${ctx.map(([n, d, on]) => `<label class="flex cursor-pointer items-start gap-3"><input type="checkbox" ${on ? 'checked' : ''} class="mt-0.5 h-4 w-4 accent-[#3366ff]"><span class="flex flex-col"><span class="text-[13px] text-black">${n}</span><span class="text-xs text-k-muted">${d}</span></span></label>`).join('')}
          <div class="flex flex-col gap-1 border-t border-k-line pt-3"><span class="text-xs text-k-muted">Full sections are added when the talk names them: REQ-005, REQ-010 so far.</span><span class="text-xs text-k-muted">About 7k of 40k tokens used. Older messages are summarised when it gets long.</span></div></div>`)}
        ${card(`<div class="flex flex-col gap-2">${h2('Earlier discussions')}${[['DSC-0003', 'Review pack for the spec', S.dAgreed ? 'CR-0017' : 'In progress'], ['DSC-0002', 'Notify Slack on approval', 'Parked'], ['DSC-0001', 'AI readiness report', 'CR-0015']].map(([i, t, s]) => `<div class="flex items-center gap-2 border-b border-[#f0f2f5] py-1.5 last:border-0"><span class="font-mono text-xs text-k-blue">${i}</span><span class="flex-1 truncate text-[13px] text-black">${t}</span>${tag(s, s.startsWith('CR') ? 'ok' : s === 'Parked' ? 'gray' : 'blue')}</div>`).join('')}<span class="text-xs text-k-muted">A discussion without a change request stays in .keel/discussions, marked Parked.</span></div>`)}
      </div></div></div>`;
};
let dTimer = null;
function dStream() {
  clearInterval(dTimer);
  const text = DSC[S.dStep - 1][1];
  S.dStreamLen = 0;
  dTimer = setInterval(() => {
    S.dStreamLen += 9;
    if (S.dStreamLen >= text.length || S.route !== 'discuss') { clearInterval(dTimer); S.dStreamLen = null; }
    render(); window.scrollTo(0, document.body.scrollHeight);
  }, 25);
}

const simple = (title, text) => `<div class="flex flex-col gap-6"><h1 class="text-2xl font-bold text-black">${title}</h1>${card(`<p class="text-k-sec">${text}</p><p class="mt-3 text-xs text-k-muted">This screen is not rebuilt in the Tailwind version yet. The original clickable mockup has it.</p>`)}</div>`;
SCREENS.setup = () => simple('Project setup', 'Change the title, description, templates, brainstorm style or standards. Saved to .keel/config.yml as a Keel commit.');
SCREENS.styles = () => simple('Brainstorm styles', 'Versioned skill files in .keel/styles: Challenger, Coach, Cost and value, Market, Engineering-first.');
SCREENS.standards = () => simple('Standards', 'Conventions and guidelines in .keel/standards that the spec, plan and code are checked against.');

/* ---------- render and events ---------- */
function render() {
  const fn = SCREENS[S.route] || SCREENS.open;
  document.getElementById('app').innerHTML = shell(fn());
}
function route() { const r = location.hash.slice(1); S.route = SCREENS[r] ? r : 'open'; render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const [a, b, c] = el.dataset.act.split(':');
  const F = S.fields;
  if (a.startsWith('rradv-')) { S.rrAdv[a.slice(6)] = b; render(); return; }
  switch (a) {
    case 'check': set({ check: b }); break;
    case 'recheck': set({ checking: true }); setTimeout(() => set({ checking: false, check: 'ok' }), 1200); break;
    case 'initcase': set({ initCase: b }); break;
    case 'initpath': set({ initPath: b }); break;
    case 'fold': S.openFolders[b] = !S.openFolders[b]; render(); break;
    case 'focus': if (S.active !== b) { set({ active: b }); } break;
    case 'apply': F[b].v = F[b].c[2]; F[b].applied = true; set({ reviewing: true }); setTimeout(() => { F[b].c = ['ok', 'Specific, and it lines up with the other sections.']; set({ reviewing: false }); }, 1200); break;
    case 'dismiss': F[b].c = [F[b].c[0], F[b].c[1]]; render(); break;
    case 'accept': F[b].sug = false; set({ reviewing: true }); setTimeout(() => { F[b].c = ['ok', 'Specific and testable.']; set({ reviewing: false }); }, 1200); break;
    case 'clear': F[b].v = ''; F[b].sug = false; F[b].c = ['ask', 'What does better look like?']; render(); break;
    case 'spectab': set({ specTab: b }); break;
    case 'decedit': S.dec[b + ':edit'] = true; render(); break;
    case 'decpick': S.dec[b + ':pick'] = c; render(); break;
    case 'decide': { const t = TOPICS.find((x) => x[0] === b); S.dec[b] = S.dec[b + ':pick'] ?? S.dec[b] ?? t[4] ?? t[3].find((o) => o[2])[0]; S.dec[b + ':edit'] = false; render(); break; }
    case 'copy': set({ copied: true }); break;
    case 'readme': set({ readme: b }); break;
    case 'write': set({ written: true }); break;
    case 'push': set({ pushed: true }); break;
    case 'chf': set({ chFilter: b }); break;
    case 'plan': set({ planned: true }); break;
    case 'scacc': S.crScen[el.dataset.act.slice(6)] = 'accepted'; render(); break;
    case 'sccl': S.crScen[el.dataset.act.slice(5)] = 'cleared'; render(); break;
    case 'tpl': set({ tplSel: b }); break;
    case 'rrkind': set({ rrKind: b, rrPhase: S.rrPhase === 'done' ? 'done' : 'idle', rrDone: false }); break;
    case 'rrread': { const k = S.rrKind + el.dataset.act.slice(7); const f = RR[S.rrKind].files.find((x) => S.rrKind + x[0] === k); S.rrRead[k] = !(S.rrRead[k] ?? f[1]); render(); break; }
    case 'rrrun': { set({ rrPhase: 'running', rrStep: 0, rrDone: false }); const tickStep = () => { if (S.route !== 'readiness') { S.rrPhase = 'done'; return; } if (S.rrStep >= RR_STEPS.length - 1) { set({ rrPhase: 'done' }); return; } set({ rrStep: S.rrStep + 1 }); setTimeout(tickStep, 350); }; setTimeout(tickStep, 350); break; }
    case 'rrnext': if (S.rrKind === 'new') { location.hash = 'init'; } else set({ rrDone: true }); break;
    case 'dstage': clearInterval(dTimer); S.dStreamLen = null; if (b === 'done') set({ dStep: DSC.length, dAgreed: true, dEdit: false }); else set({ dStep: +b, dAgreed: false, dEdit: false }); break;
    case 'dsend': S.dStep += 2; dStream(); break;
    case 'dstop': clearInterval(dTimer); set({ dStreamLen: null }); break;
    case 'dagree': set({ dAgreed: true, dEdit: false }); break;
    case 'dedit': set({ dEdit: !S.dEdit }); break;
    case 'dmore': document.getElementById('dinput')?.focus(); break;
    case 'dreset': set({ dStep: 0, dAgreed: false }); break;
    case 'ollama': set({ ollama: S.ollama === 'up' ? 'down' : 'up' }); break;
  }
});
document.addEventListener('change', (e) => { if (e.target.dataset.change === 'provider') set({ provider: e.target.value }); });
route();
</script>
</body>
