name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Keep scenario results for Keel read-back
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-results
          path: test-results/bdd.json
